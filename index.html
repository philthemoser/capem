/* ---- Training ---------------------------------------------------------- */
'train.title': ['Onboard someone in minutes, not mornings', 'Formar a alguien en minutos, no en mañanas', 'Formar alguém em minutos, não em manhãs'],
'train.lede': [
  'Volunteers rotate daily, which means the manual nobody reads is not a training strategy. Each course runs inside the real screens, explains the reasoning rather than the button, and ends with one judgement call. Reasoning is what lets somebody improvise correctly when the day goes off-script, and it always does.',
  'El voluntariado rota a diario, así que el manual que nadie lee no es una estrategia de formación. Cada curso corre dentro de las pantallas reales, explica el razonamiento y no el botón, y termina con una decisión de criterio. El razonamiento es lo que permite improvisar bien cuando el día se sale del guion, y siempre se sale.',
  'O voluntariado muda todo dia, então o manual que ninguém lê não é uma estratégia de formação. Cada curso roda dentro das telas reais, explica o raciocínio e não o botão, e termina com uma decisão de critério. O raciocínio é o que permite improvisar certo quando o dia sai do roteiro, e sempre sai.'],
'train.stepsMins': ['{steps} steps + 1 scenario · about {mins} min', '{steps} pasos + 1 escenario · unos {mins} min', '{steps} passos + 1 cenário · cerca de {mins} min'],
'train.start': ['Start', 'Empezar', 'Começar'],
'train.retake': ['Take it again', 'Repetir', 'Refazer'],
'train.trained': ['Completed', 'Completado', 'Concluído'],
'train.exit': ['Close the course', 'Cerrar el curso', 'Fechar o curso'],
'train.behindScenes': ['What this actually does', 'Qué hace esto en realidad', 'O que isto realmente faz'],
'train.toScenario': ['To the scenario', 'Al escenario', 'Para o cenário'],
'train.scenarioCheck': ['One judgement call', 'Una decisión de criterio', 'Uma decisão de critério'],
'train.finish': ['Finish', 'Terminar', 'Concluir'],
'train.completed': ['Course completed', 'Curso completado', 'Curso concluído'],
'train.whyTitle': ['Why training is inside the product', 'Por qué la formación está dentro del producto', 'Por que a formação está dentro do produto'],
'train.why1t': ['The learner is already at the table.', 'Quien aprende ya está en la mesa.', 'Quem aprende já está na mesa.'],
'train.why1': ['A three-minute course finished while the queue forms beats a document that gets read never.',
  'Un curso de tres minutos terminado mientras se forma la fila le gana a un documento que nunca se lee.',
  'Um curso de três minutos terminado enquanto a fila se forma ganha de um documento que nunca é lido.'],
'train.why2t': ['Explain the why, not the where.', 'Explicar el porqué, no el dónde.', 'Explicar o porquê, não o onde.'],
'train.why2': ['Somebody who knows why one category per bag matters will handle the case the training never covered.',
  'Quien entiende por qué importa una categoría por bolsa sabrá manejar el caso que la formación nunca cubrió.',
  'Quem entende por que uma categoria por saco importa vai lidar com o caso que a formação nunca cobriu.'],
'train.why3t': ['Completion is operational data.', 'La finalización es dato operativo.', 'A conclusão é dado operacional.'],
'train.why3': ['A badge on the roster lets shift assignment require training the way it requires a driving licence.',
  'Un distintivo en la lista permite exigir formación para asignar turnos, igual que se exige una licencia.',
  'Um selo na equipe permite exigir formação para atribuir turnos, igual se exige uma habilitação.'],
'train.honestTitle': ['An honest caveat', 'Una advertencia honesta', 'Uma ressalva honesta'],
'train.honestBody': [
  'We have no evidence yet that a three-minute in-app course actually produces competent intake volunteers. It is a plausible answer to a real problem, not a tested one, and it is on the open-questions list for that reason.',
  'Aún no tenemos evidencia de que un curso de tres minutos dentro de la app produzca voluntarios de recepción competentes. Es una respuesta plausible a un problema real, no una probada, y por eso está en la lista de preguntas abiertas.',
  'Ainda não temos evidência de que um curso de três minutos dentro do app produza voluntários de recepção competentes. É uma resposta plausível a um problema real, não testada, e por isso está na lista de perguntas em aberto.'],

/* ---- Course: intake ---------------------------------------------------- */
'course.intake.title': ['Intake', 'Recepción', 'Recepção'],
'course.intake.desc': ['Why the code exists, how to confirm bags fast, and how to say a kind, firm no.',
  'Por qué existe el código, cómo confirmar bolsas rápido, y cómo decir un no amable y firme.',
  'Por que o código existe, como confirmar sacos rápido, e como dizer um não gentil e firme.'],
'course.intake.s0.h': ['You are the front door', 'Usted es la puerta de entrada', 'Você é a porta de entrada'],
'course.intake.s0.p': ['Everything that arrives passes through you — bags, boxes and people. Done well a donor is in and out in seconds. Done badly, a mountain of unsorted goods forms behind you by lunchtime and stays for weeks.',
  'Todo lo que llega pasa por usted — bolsas, cajas y personas. Bien hecho, un donante entra y sale en segundos. Mal hecho, para el mediodía se forma detrás suyo una montaña sin clasificar que se queda semanas.',
  'Tudo o que chega passa por você — sacos, caixas e pessoas. Bem feito, um doador entra e sai em segundos. Mal feito, até o meio-dia se forma atrás de você uma montanha não triada que fica semanas.'],
'course.intake.s0.b': ['Every action on this screen updates stock, the public needs board and the donor\'s notification at once. You are not doing data entry; you are the only person who touches all three.',
  'Cada acción en esta pantalla actualiza a la vez el inventario, el tablero público y la notificación al donante. No está capturando datos; es la única persona que toca las tres cosas.',
  'Cada ação nesta tela atualiza ao mesmo tempo o estoque, o painel público e a notificação ao doador. Você não está digitando dados; é a única pessoa que toca nas três coisas.'],
'course.intake.s1.h': ['The code did the work already', 'El código ya hizo el trabajo', 'O código já fez o trabalho'],
'course.intake.s1.p': ['A donor who pre-registered has already told us what is in each bag. You scan or type the code and it all appears. You are confirming, not discovering.',
  'Un donante que se pre-registró ya nos dijo qué hay en cada bolsa. Escanea o teclea el código y aparece todo. Está confirmando, no descubriendo.',
  'Um doador que se pré-cadastrou já nos disse o que há em cada saco. Você escaneia ou digita o código e aparece tudo. Está confirmando, não descobrindo.'],
'course.intake.s1.b': ['The code works on a screenshot, written on the box in marker, or read out loud. Nothing here requires the donor to have a working phone when they arrive.',
  'El código funciona en una captura, escrito en la caja con marcador, o dicho en voz alta. Nada exige que el donante llegue con el celular funcionando.',
  'O código funciona num print, escrito na caixa com caneta, ou dito em voz alta. Nada exige que o doador chegue com o celular funcionando.'],
'course.intake.s2.h': ['Roughly right and fast', 'Aproximadamente correcto y rápido', 'Aproximadamente certo e rápido'],
'course.intake.s2.p': ['Glance in the bag. Does it broadly match what it says? Confirm. Do not count every bar of soap — precision here costs you the queue, and the queue is what turns donors away.',
  'Mire la bolsa. ¿Coincide a grandes rasgos con lo que dice? Confirme. No cuente cada jabón — la precisión aquí le cuesta la fila, y la fila es lo que ahuyenta donantes.',
  'Olhe o saco. Bate no geral com o que diz? Confirme. Não conte cada sabonete — a precisão aqui custa a fila, e a fila é o que afasta doadores.'],
'course.intake.s2.b': ['One category per bag is enforced when the donor packs, which is why this bag can go to a shelf without being opened and emptied first.',
  'Una categoría por bolsa se exige al empacar, por eso esta bolsa va al estante sin abrirla ni vaciarla.',
  'Uma categoria por saco é exigida na hora de embalar, por isso este saco vai para a prateleira sem ser aberto e esvaziado.'],
'course.intake.s3.h': ['The kind, firm no', 'El no amable y firme', 'O não gentil e firme'],
'course.intake.s3.p': ['This is the hardest part of the job and the most valuable. You never simply refuse: you thank, you explain, and you point at what is genuinely needed. The script is on screen so you are not improvising a hard conversation while someone waits.',
  'Esta es la parte más difícil y la más valiosa. Nunca solo rechaza: agradece, explica, y señala lo que de verdad hace falta. El guion está en pantalla para no improvisar una conversación difícil con alguien esperando.',
  'Esta é a parte mais difícil e a mais valiosa. Você nunca só recusa: agradece, explica, e aponta o que é realmente preciso. O roteiro está na tela para não improvisar uma conversa difícil com alguém esperando.'],
'course.intake.s3.b': ['Every redirect is logged. That count is the only way a centre can later show whether steering actually reduced the unusable goods arriving.',
  'Cada redireccionamiento se registra. Ese conteo es la única forma de mostrar después si la orientación redujo los bienes inservibles que llegan.',
  'Cada redirecionamento é registrado. Essa contagem é a única forma de mostrar depois se a orientação reduziu os bens inúteis que chegam.'],
'course.intake.q': ['Someone arrives with three large bags of mixed used clothing. What do you do?',
  'Alguien llega con tres bolsas grandes de ropa usada mezclada. ¿Qué hace?',
  'Alguém chega com três sacos grandes de roupa usada misturada. O que você faz?'],
'course.intake.q0': ['Accept them. Refusing feels wrong, and somebody will find a use.',
  'Aceptarlas. Rechazar se siente mal, y alguien les dará uso.',
  'Aceitar. Recusar parece errado, e alguém vai dar uso.'],
'course.intake.q0.ok': ['no', 'no', 'no'],
'course.intake.q0.fb': ['An understandable instinct, and it is how centres drown. Those bags cost volunteer hours to sort and floor space you do not have, and in documented responses clothing has reached 70% of everything arriving.',
  'Un instinto comprensible, y así se ahogan los centros. Esas bolsas cuestan horas de voluntariado y espacio que no tiene, y en respuestas documentadas la ropa ha llegado al 70% de todo lo que entra.',
  'Um instinto compreensível, e é assim que centros se afogam. Esses sacos custam horas de voluntariado e espaço que você não tem, e em respostas documentadas a roupa chegou a 70% de tudo o que entra.'],
'course.intake.q1': ['Thank them warmly, explain that clothing is not being collected, and show them what is short today.',
  'Agradecer con calidez, explicar que no se recibe ropa, y mostrarles qué falta hoy.',
  'Agradecer com calor, explicar que roupa não está sendo recebida, e mostrar o que falta hoje.'],
'course.intake.q1.ok': ['yes', 'yes', 'yes'],
'course.intake.q1.fb': ['Yes. You kept a supporter who will probably come back with something you need, you protected the centre\'s capacity, and the redirect was counted.',
  'Sí. Conservó a alguien que probablemente vuelva con algo que sí necesita, protegió la capacidad del centro, y el redireccionamiento quedó contado.',
  'Sim. Você manteve um apoiador que provavelmente volta com algo que você precisa, protegeu a capacidade do centro, e o redirecionamento foi contado.'],
'course.intake.q2': ['Turn them away. The rules are the rules.',
  'Rechazarlos. Las reglas son las reglas.',
  'Recusar. As regras são as regras.'],
'course.intake.q2.ok': ['no', 'no', 'no'],
'course.intake.q2.fb': ['The refusal is right and the delivery loses the person permanently. Someone who is embarrassed at your door does not come back with the formula you actually need next week.',
  'El rechazo es correcto y la forma pierde a la persona para siempre. Quien pasa vergüenza en su puerta no vuelve la semana que viene con la fórmula que sí necesita.',
  'A recusa está certa e a forma perde a pessoa para sempre. Quem passa vergonha na sua porta não volta semana que vem com a fórmula que você precisa.'],

/* ---- Course: gate ------------------------------------------------------ */
'course.gate.title': ['The distribution gate', 'El punto de entrega', 'O ponto de entrega'],
'course.gate.desc': ['What a voucher promises, why it never bounces, and what to do when a family asks for more.',
  'Qué promete un vale, por qué nunca rebota, y qué hacer si una familia pide más.',
  'O que um vale promete, por que nunca falha, e o que fazer se uma família pede mais.'],
'course.gate.s0.h': ['You are not deciding', 'Usted no está decidiendo', 'Você não está decidindo'],
'course.gate.s0.p': ['The allocation already happened, upstream, from registered need against stock that exists. That is deliberate: it keeps the hardest conversation away from the table, and it means you can be entirely on the family\'s side.',
  'La asignación ya ocurrió, antes, con necesidad registrada contra existencias reales. Es a propósito: mantiene la conversación más difícil lejos de la mesa, y le permite estar del lado de la familia.',
  'A alocação já aconteceu, antes, com necessidade registrada contra estoque real. É de propósito: mantém a conversa mais difícil longe da mesa, e permite que você fique do lado da família.'],
'course.gate.s0.b': ['Ordering by registered need rather than by who queued longest is what keeps a distribution calm.',
  'Ordenar por necesidad registrada y no por quién hizo más fila es lo que mantiene tranquila una entrega.',
  'Ordenar por necessidade registrada e não por quem ficou mais na fila é o que mantém uma entrega calma.'],
'course.gate.s1.h': ['A voucher never bounces', 'Un vale nunca rebota', 'Um vale nunca falha'],
'course.gate.s1.p': ['The stock on a voucher was reserved the moment it was issued. If it is on the voucher, it is on the shelf with that family\'s name against it.',
  'Las existencias de un vale se reservaron al emitirlo. Si está en el vale, está en el estante a nombre de esa familia.',
  'O estoque de um vale foi reservado no momento da emissão. Se está no vale, está na prateleira em nome daquela família.'],
'course.gate.s1.b': ['This costs a little availability on paper. It buys the thing that matters more: nobody is sent away empty after being told to come.',
  'Esto cuesta algo de disponibilidad en papel. Compra lo que importa más: nadie se va con las manos vacías después de que le dijeran que viniera.',
  'Isto custa um pouco de disponibilidade no papel. Compra o que importa mais: ninguém vai embora de mãos vazias depois de ter sido chamado.'],
'course.gate.s2.h': ['When the day goes off-script', 'Cuando el día se sale del guion', 'Quando o dia sai do roteiro'],
'course.gate.s2.p': ['A family asks for two more blankets and the blankets are right there. Do not improvise a substitution — those blankets are already promised to somebody else\'s voucher. Record the request instead, and it enters the next allocation properly.',
  'Una familia pide dos cobijas más y las cobijas están ahí. No improvise — esas cobijas ya están prometidas en el vale de otro. Registre la solicitud, y entrará bien en la siguiente asignación.',
  'Uma família pede mais dois cobertores e os cobertores estão ali. Não improvise — esses cobertores já estão prometidos no vale de outra pessoa. Registre o pedido, e ele entra direito na próxima alocação.'],
'course.gate.s2.b': ['Hands move goods, the system moves ownership. Improvised swaps are how a paper-and-goodwill operation quietly loses track of itself.',
  'Las manos mueven bienes, el sistema mueve la propiedad. Los cambios improvisados son como una operación de papel y buena voluntad se pierde en silencio.',
  'As mãos movem bens, o sistema move a propriedade. Trocas improvisadas são como uma operação de papel e boa vontade se perde em silêncio.'],
'course.gate.q': ['A family\'s voucher lists two blankets. They ask for two more — the nights are cold, and there are blankets on the shelf behind you.',
  'El vale de una familia lista dos cobijas. Piden dos más — las noches son frías, y hay cobijas en el estante detrás suyo.',
  'O vale de uma família lista dois cobertores. Pedem mais dois — as noites são frias, e há cobertores na prateleira atrás de você.'],
'course.gate.q0': ['Give them the extra blankets. The need is real and the blankets are right there.',
  'Darles las cobijas extra. La necesidad es real y las cobijas están ahí.',
  'Dar os cobertores extras. A necessidade é real e os cobertores estão ali.'],
'course.gate.q0.ok': ['no', 'no', 'no'],
'course.gate.q0.fb': ['The need is real, and those blankets are already reserved against another household\'s voucher. Giving them away means someone else is turned away tonight, and you will not be there to see it.',
  'La necesidad es real, y esas cobijas ya están reservadas para el vale de otro hogar. Darlas significa que alguien se va sin nada esta noche, y usted no lo verá.',
  'A necessidade é real, e esses cobertores já estão reservados para o vale de outra família. Dá-los significa que alguém vai embora sem nada hoje, e você não vai ver.'],
'course.gate.q1': ['Hand over what the voucher lists, and record the extra request so it enters the next allocation.',
  'Entregar lo que lista el vale, y registrar la solicitud extra para la siguiente asignación.',
  'Entregar o que o vale lista, e registrar o pedido extra para a próxima alocação.'],
'course.gate.q1.ok': ['yes', 'yes', 'yes'],
'course.gate.q1.fb': ['Right. The household\'s registered need goes up, the engine allocates from real stock — possibly tonight — and nobody else\'s voucher breaks.',
  'Correcto. La necesidad registrada del hogar sube, el motor asigna desde existencias reales — quizá esta noche — y no se rompe el vale de nadie.',
  'Certo. A necessidade registrada da família sobe, o motor aloca a partir do estoque real — talvez hoje — e o vale de mais ninguém quebra.'],
'course.gate.q2': ['Refuse and explain that the rules are the rules.',
  'Negarse y explicar que las reglas son las reglas.',
  'Recusar e explicar que as regras são as regras.'],
'course.gate.q2.ok': ['no', 'no', 'no'],
'course.gate.q2.fb': ['Half right. Do not hand over unallocated stock — but a need nobody wrote down is a need the system cannot meet. Refusing without recording it just moves the problem out of sight.',
  'A medias. No entregue existencias no asignadas — pero una necesidad que nadie anotó es una necesidad que el sistema no puede cubrir. Negarse sin registrarla solo esconde el problema.',
  'Meio certo. Não entregue estoque não alocado — mas uma necessidade que ninguém anotou é uma necessidade que o sistema não consegue atender. Recusar sem registrar só esconde o problema.'],

/* ---- Course: coordinator ----------------------------------------------- */
'course.coordinator.title': ['Running the centre', 'Dirigir el centro', 'Dirigir o centro'],
'course.coordinator.desc': ['Curating what the public sees, defending an allocation, and the one line in a broadcast that matters most.',
  'Curar lo que ve el público, defender una asignación, y la línea de la difusión que más importa.',
  'Curar o que o público vê, defender uma alocação, e a linha da transmissão que mais importa.'],
'course.coordinator.s0.h': ['Your numbers are not reports', 'Sus cifras no son reportes', 'Seus números não são relatórios'],
'course.coordinator.s0.p': ['Nobody compiles the figures on your command view. They are by-products of scans, registrations and handovers, keyed by the same references. That is why they agree with each other, and why they are never a day old.',
  'Nadie compila las cifras de su vista de mando. Son subproductos de escaneos, registros y entregas, con las mismas referencias. Por eso concuerdan entre sí, y por eso nunca tienen un día de retraso.',
  'Ninguém compila os números do seu painel. São subprodutos de escaneamentos, registros e entregas, com as mesmas referências. Por isso concordam entre si, e por isso nunca estão um dia atrasados.'],
'course.coordinator.s0.b': ['Reporting that requires someone to sit down and assemble it does not survive a busy week. Anything that must be maintained by hand will drift.',
  'Un reporte que exige que alguien se siente a armarlo no sobrevive una semana ocupada. Todo lo que se mantiene a mano se desactualiza.',
  'Um relatório que exige alguém sentar e montá-lo não sobrevive a uma semana cheia. Tudo que se mantém à mão desatualiza.'],
'course.coordinator.s1.h': ['Allocation you can defend out loud', 'Una asignación que pueda defender en voz alta', 'Uma alocação que você possa defender em voz alta'],
'course.coordinator.s1.p': ['Open any household on the matching screen and you can see exactly why it sits where it does. You will be asked this by somebody upset, and "the system decided" is not an answer that holds a queue together.',
  'Abra cualquier hogar en la pantalla de asignación y verá exactamente por qué está donde está. Alguien molesto se lo preguntará, y "lo decidió el sistema" no es una respuesta que sostenga una fila.',
  'Abra qualquer família na tela de alocação e você vê exatamente por que ela está onde está. Alguém irritado vai perguntar, e "o sistema decidiu" não é uma resposta que segure uma fila.'],
'course.coordinator.s1.b': ['The rules are configuration, not code. If the ordering is wrong for your context, that is a thing you change, not a thing you accept.',
  'Las reglas son configuración, no código. Si el orden no sirve para su contexto, es algo que se cambia, no algo que se acepta.',
  'As regras são configuração, não código. Se a ordem não serve para o seu contexto, é algo que se muda, não algo que se aceita.'],
'course.coordinator.s2.h': ['Mark things covered', 'Marque lo cubierto', 'Marque o que está coberto'],
'course.coordinator.s2.p': ['Raising an urgent need is the easy half. The half people forget is marking things covered and pausing intake, and it is worth more. A published need you no longer have keeps pulling in goods you now have to store.',
  'Subir una necesidad urgente es la mitad fácil. La mitad que se olvida es marcar lo cubierto y pausar la recepción, y vale más. Una necesidad publicada que ya no tiene sigue atrayendo bienes que ahora hay que almacenar.',
  'Elevar uma necessidade urgente é a metade fácil. A metade que se esquece é marcar o que está coberto e pausar a recepção, e vale mais. Uma necessidade publicada que você já não tem continua atraindo bens que agora precisa armazenar.'],
'course.coordinator.s2.b': ['One switch changes the donor page, the drop-off points, and the "please do not bring" line of the next message. There is nowhere else to remember to update.',
  'Un interruptor cambia la página del donante, los puntos de acopio, y la línea de "por favor no traer" del próximo mensaje. No hay ningún otro sitio que recordar actualizar.',
  'Um botão muda a página do doador, os pontos de coleta, e a linha de "por favor não traga" da próxima mensagem. Não há outro lugar para lembrar de atualizar.'],
'course.coordinator.s3.h': ['The most valuable line you will send', 'La línea más valiosa que enviará', 'A linha mais valiosa que você vai enviar'],
'course.coordinator.s3.p': ['Your community is in a WhatsApp group, and the message is written for you from the live board. Note the order: urgent first, also-accepting second, and then what not to bring. That last line prevents more chaos than any dashboard resolves.',
  'Su comunidad está en un grupo de WhatsApp, y el mensaje se escribe solo desde el tablero en vivo. Note el orden: urgente primero, también recibimos segundo, y luego qué no traer. Esa última línea evita más caos del que resuelve cualquier tablero.',
  'Sua comunidade está num grupo de WhatsApp, e a mensagem é escrita sozinha a partir do painel ao vivo. Note a ordem: urgente primeiro, também recebemos segundo, e depois o que não trazer. Essa última linha evita mais caos do que qualquer painel resolve.'],
'course.coordinator.s3.b': ['It regenerates every time. You never keep a pinned message in sync by hand again, which is the task that always gets abandoned by day three.',
  'Se regenera cada vez. Nunca más mantiene a mano un mensaje fijado, que es la tarea que siempre se abandona al tercer día.',
  'Ela se regenera toda vez. Você nunca mais mantém à mão uma mensagem fixada, que é a tarefa sempre abandonada no terceiro dia.'],
'course.coordinator.q': ['It is day four. Tarpaulins reach 95% of target and donations keep arriving. What is the right move?',
  'Es el día cuatro. Las lonas llegan al 95% de la meta y siguen llegando donaciones. ¿Cuál es la jugada correcta?',
  'É o quarto dia. As lonas chegam a 95% da meta e as doações continuam chegando. Qual é a jogada certa?'],
'course.coordinator.q0': ['Keep collecting. Better too much than too little in a disaster.',
  'Seguir recibiendo. Mejor de más que de menos en un desastre.',
  'Continuar recebendo. Melhor demais que de menos num desastre.'],
'course.coordinator.q0.ok': ['no', 'no', 'no'],
'course.coordinator.q0.fb': ['Surplus is not free. It costs shelf space, volunteer hours, and donor goodwill spent on something you did not need. "Too much" is a documented way that centres drown.',
  'El excedente no es gratis. Cuesta espacio, horas de voluntariado, y buena voluntad gastada en algo que no hacía falta. "Demasiado" es una forma documentada de ahogar centros.',
  'A sobra não é de graça. Custa espaço, horas de voluntariado, e boa vontade gasta em algo que não era preciso. "Demais" é uma forma documentada de afogar centros.'],
'course.coordinator.q1': ['Pause tarpaulin intake, mark it covered, and let the next broadcast redirect people to what is short.',
  'Pausar la recepción de lonas, marcarla cubierta, y dejar que la próxima difusión redirija a lo que falta.',
  'Pausar a recepção de lonas, marcar como coberta, e deixar a próxima transmissão redirecionar para o que falta.'],
'course.coordinator.q1.ok': ['yes', 'yes', 'yes'],
'course.coordinator.q1.fb': ['Yes, and the timing is the point. Redirecting generosity while it is still warm is far more effective than turning it away at the door next week.',
  'Sí, y el momento es lo importante. Redirigir la generosidad mientras está caliente es mucho más eficaz que rechazarla en la puerta la semana que viene.',
  'Sim, e o momento é o que importa. Redirecionar a generosidade enquanto está quente é bem mais eficaz que recusá-la na porta semana que vem.'],
'course.coordinator.q2': ['Quietly delete the tarpaulin need so it stops appearing.',
  'Borrar en silencio la necesidad de lonas para que deje de aparecer.',
  'Apagar em silêncio a necessidade de lonas para parar de aparecer.'],
'course.coordinator.q2.ok': ['no', 'no', 'no'],
'course.coordinator.q2.fb': ['Marking it covered rather than deleting it keeps the history. The transparency record and the "covered, thank you" message to the people who gave both depend on it.',
  'Marcarla cubierta en vez de borrarla conserva el historial. El registro de transparencia y el mensaje de "cubierto, gracias" a quienes donaron dependen de eso.',
  'Marcar como coberta em vez de apagar mantém o histórico. O registro de transparência e a mensagem de "coberto, obrigado" a quem doou dependem disso.'],

/* ---- About ------------------------------------------------------------- */
'about.title': ['What this is, and what it is not', 'Qué es esto, y qué no es', 'O que é isto, e o que não é'],
'about.lede': [
  'It is easier to evaluate something when its author has already said where it is weak. So: here is the scope, stated plainly, before you find the gaps yourself.',
  'Es más fácil evaluar algo cuando su autor ya dijo dónde es débil. Así que: aquí está el alcance, dicho claramente, antes de que usted encuentre los huecos.',
  'É mais fácil avaliar algo quando o autor já disse onde é fraco. Então: aqui está o escopo, dito com clareza, antes que você mesmo encontre as falhas.'],
'about.isTitle': ['What it is', 'Qué es', 'O que é'],
'about.is1': ['A working prototype of one idea: donations described before they travel, and allocation that can be explained.',
  'Un prototipo funcional de una idea: donaciones descritas antes de viajar, y asignación que se puede explicar.',
  'Um protótipo funcional de uma ideia: doações descritas antes de viajar, e alocação que dá para explicar.'],
'about.is2': ['Built on one data model, so the numbers on every screen come from the same place and cannot contradict each other.',
  'Construido sobre un solo modelo de datos, así las cifras de cada pantalla salen del mismo sitio y no pueden contradecirse.',
  'Construído sobre um único modelo de dados, então os números de cada tela vêm do mesmo lugar e não podem se contradizer.'],
'about.is3': ['Grounded in documented events and cited literature, with the weak evidence marked as weak.',
  'Basado en eventos documentados y literatura citada, con la evidencia débil marcada como débil.',
  'Baseado em eventos documentados e literatura citada, com a evidência fraca marcada como fraca.'],
'about.is4': ['An argument, offered to people who know more about this than its authors do.',
  'Un argumento, ofrecido a quienes saben más de esto que sus autores.',
  'Um argumento, oferecido a quem sabe mais disto que seus autores.'],
'about.isNotTitle': ['What it is not', 'Qué no es', 'O que não é'],
'about.isNot1': ['Not software anyone is running. It has never been used in a real response and should not be until it has been taken apart.',
  'No es software en uso. Nunca se ha usado en una respuesta real y no debería usarse hasta que lo desmonten.',
  'Não é software em uso. Nunca foi usado numa resposta real e não deveria ser até que o desmontem.'],
'about.isNot2': ['Not real data. Both scenarios are invented, including every centre, household, quantity and event.',
  'No son datos reales. Ambos escenarios son inventados, incluidos todos los centros, hogares, cantidades y eventos.',
  'Não são dados reais. Ambos os cenários são inventados, incluindo todos os centros, famílias, quantidades e eventos.'],
'about.isNot3': ['Not validated. No pilot has run, so every efficiency claim here is a hypothesis rather than a result.',
  'No está validado. No ha habido piloto, así que toda afirmación de eficiencia es una hipótesis, no un resultado.',
  'Não está validado. Não houve piloto, então toda afirmação de eficiência é uma hipótese, não um resultado.'],
'about.isNot4': ['Not neutral about people\'s data. See the data-protection page — that position is a constraint on the design, not a disclaimer under it.',
  'No es neutral sobre los datos de las personas. Vea la página de protección de datos — esa postura restringe el diseño, no es un descargo al pie.',
  'Não é neutro sobre os dados das pessoas. Veja a página de proteção de dados — essa posição restringe o projeto, não é um aviso no rodapé.'],
'about.newTitle': ['What is actually new here', 'Qué hay de realmente nuevo', 'O que há de realmente novo'],
'about.newBody': [
  'Being precise about this matters, because a claim of novelty that does not survive five minutes of checking destroys everything else you say.',
  'Ser preciso aquí importa, porque una afirmación de novedad que no sobrevive cinco minutos de verificación destruye todo lo demás que diga.',
  'Ser preciso aqui importa, porque uma alegação de novidade que não sobrevive a cinco minutos de verificação destrói todo o resto que você diz.'],
'about.n1t': ['The unit of registration.', 'La unidad de registro.', 'A unidade de registro.'],
'about.n1': ['Not the donation, not the offer, but the individual bag or box — carrying a scannable tag, scanned in at the door.',
  'No la donación ni la oferta, sino cada bolsa o caja — con etiqueta escaneable, escaneada en la puerta.',
  'Não a doação nem a oferta, mas cada saco ou caixa — com etiqueta escaneável, escaneada na porta.'],
'about.n2t': ['The centre as the customer.', 'El centro como cliente.', 'O centro como cliente.'],
'about.n2': ['Not an agency adopting a system, but an improvised place that needs to be operational this afternoon, using only the blocks it lacks.',
  'No una agencia adoptando un sistema, sino un lugar improvisado que necesita operar esta tarde, usando solo los bloques que le faltan.',
  'Não uma agência adotando um sistema, mas um lugar improvisado que precisa operar esta tarde, usando só os blocos que lhe faltam.'],
'about.precedent': [
  'The nearest precedent we found is the Aidmatrix-powered National Donations Management Network, which from the late 2000s let donors post goods offers online for agencies to accept before shipment. That is pre-registration at the level of the offer, with no container tagging and no scan-in — and it is now defunct, which is a question worth asking us about.',
  'El precedente más cercano que encontramos es la National Donations Management Network de Aidmatrix, que desde finales de los 2000 permitía a donantes publicar ofertas de bienes para que las agencias las aceptaran antes del envío. Eso es pre-registro a nivel de oferta, sin etiquetado de bultos ni escaneo de entrada — y hoy está desaparecida, lo que es una pregunta que vale hacernos.',
  'O precedente mais próximo que encontramos é a National Donations Management Network da Aidmatrix, que desde o fim dos anos 2000 permitia a doadores publicar ofertas de bens para agências aceitarem antes do envio. Isso é pré-cadastro no nível da oferta, sem etiquetagem de volumes nem escaneamento de entrada — e hoje está extinta, o que é uma pergunta que vale nos fazer.'],
'about.dataTitle': ['Where the evidence lives', 'Dónde está la evidencia', 'Onde está a evidência'],
'about.dataBody': [
  'Every factual claim this prototype makes is sourced in the repository, with a confidence rating per section and an explicit list of what we could not verify.',
  'Toda afirmación factual de este prototipo está referenciada en el repositorio, con un nivel de confianza por sección y una lista explícita de lo que no pudimos verificar.',
  'Toda afirmação factual deste protótipo está referenciada no repositório, com um nível de confiança por seção e uma lista explícita do que não conseguimos verificar.'],
'about.readResearch': ['See docs/research.md', 'Ver docs/research.md', 'Ver docs/research.md'],
'about.docsNote': ['In the repository, not in this page — the demo should not be the only copy of the argument.',
  'En el repositorio, no en esta página — la demo no debería ser la única copia del argumento.',
  'No repositório, não nesta página — a demo não deveria ser a única cópia do argumento.'],

/* ---- Data protection --------------------------------------------------- */
'dp.title': ['Data protection', 'Protección de datos', 'Proteção de dados'],
'dp.lede': [
  'If you run a centre, you carry the legal and ethical responsibility for the people in it. This is the position the design takes, and the parts it does not solve.',
  'Si dirige un centro, usted carga con la responsabilidad legal y ética de las personas que están en él. Esta es la postura del diseño, y las partes que no resuelve.',
  'Se você dirige um centro, carrega a responsabilidade legal e ética pelas pessoas que estão nele. Esta é a posição do projeto, e as partes que ele não resolve.'],
'dp.basisTitle': ['Why consent is usually the wrong basis', 'Por qué el consentimiento suele ser la base equivocada', 'Por que o consentimento costuma ser a base errada'],
'dp.basisBody': [
  'The instinct is to add a consent checkbox. The ICRC Handbook on Data Protection in Humanitarian Action is explicit that this often does not work here, because consent must be freely given and somebody who needs shelter tonight is not in a position to refuse.',
  'El instinto es añadir una casilla de consentimiento. El Manual del CICR sobre protección de datos en la acción humanitaria es explícito en que eso muchas veces no funciona aquí, porque el consentimiento debe ser libre y quien necesita albergue esta noche no está en posición de negarse.',
  'O instinto é adicionar uma caixa de consentimento. O Manual do CICV sobre proteção de dados na ação humanitária é explícito que isso muitas vezes não funciona aqui, porque o consentimento precisa ser livre e quem precisa de abrigo hoje à noite não está em posição de recusar.'],
'dp.quote': [
  'Consent is not valid where the data subject "has no genuine and free choice, or is unable to refuse or withdraw Consent without detriment" — a problem sharpened when consenting is a precondition of receiving assistance.',
  'El consentimiento no es válido cuando la persona "no tiene una elección genuina y libre, o no puede negarse o retirarlo sin perjuicio" — problema que se agrava cuando consentir es condición para recibir asistencia.',
  'O consentimento não é válido quando a pessoa "não tem escolha genuína e livre, ou não pode recusar ou retirá-lo sem prejuízo" — problema agravado quando consentir é condição para receber assistência.'],
'dp.cite': ['ICRC / Brussels Privacy Hub, Handbook on Data Protection in Humanitarian Action, 3rd edition, November 2024, chapter 3',
  'CICR / Brussels Privacy Hub, Manual sobre protección de datos en la acción humanitaria, 3ª edición, noviembre de 2024, capítulo 3',
  'CICV / Brussels Privacy Hub, Manual sobre proteção de dados na ação humanitária, 3ª edição, novembro de 2024, capítulo 3'],
'dp.basisAlt': [
  'The Handbook does not say consent is never valid — it offers other bases instead: vital interest, important grounds of public interest, and legitimate interest. Each of those places the burden of judgement on the organisation rather than on somebody who cannot really say no. That is the point of the shift.',
  'El Manual no dice que el consentimiento nunca sea válido — ofrece otras bases: interés vital, razones importantes de interés público, e interés legítimo. Cada una pone la carga del juicio en la organización y no en alguien que no puede negarse de verdad. Ese es el sentido del cambio.',
  'O Manual não diz que o consentimento nunca é válido — oferece outras bases: interesse vital, motivos importantes de interesse público, e interesse legítimo. Cada uma coloca o ônus do julgamento na organização e não em alguém que não pode realmente recusar. É esse o sentido da mudança.'],
'dp.designTitle': ['What that means in this design', 'Qué significa eso en este diseño', 'O que isso significa neste projeto'],
'dp.d1t': ['Collect less, rather than consent better.', 'Recoger menos, en vez de consentir mejor.', 'Coletar menos, em vez de consentir melhor.'],
'dp.d1': ['Household size, children under five, adults over 65, a medical flag. No identity numbers, no addresses, no nationality, no ethnicity or religion, no biometrics.',
  'Tamaño del hogar, menores de cinco, mayores de 65, marca médica. Sin números de documento, sin direcciones, sin nacionalidad, sin etnia ni religión, sin biometría.',
  'Tamanho da família, menores de cinco, maiores de 65, marca médica. Sem números de documento, sem endereços, sem nacionalidade, sem etnia ou religião, sem biometria.'],
'dp.d2t': ['A reference, not a dossier.', 'Una referencia, no un expediente.', 'Uma referência, não um dossiê.'],
'dp.d2': ['The spine needs a key to join records. Everything beyond that key is a liability that outlives the emergency.',
  'La columna necesita una llave para unir registros. Todo lo que exceda esa llave es un riesgo que sobrevive a la emergencia.',
  'A espinha precisa de uma chave para ligar registros. Tudo além dessa chave é um risco que sobrevive à emergência.'],
'dp.d3t': ['Aggregates flow out, records stay.', 'Los agregados salen, los registros se quedan.', 'Os agregados saem, os registros ficam.'],
'dp.d3': ['Capacity, totals and demographics can be shared upward. The list of individuals does not leave the centre.',
  'Capacidad, totales y demografía se pueden compartir hacia arriba. La lista de individuos no sale del centro.',
  'Capacidade, totais e demografia podem ser compartilhados para cima. A lista de indivíduos não sai do centro.'],
'dp.d4t': ['Retention is short and stated.', 'La retención es corta y declarada.', 'A retenção é curta e declarada.'],
'dp.d4': ['Data collected to serve someone during an emergency has no business surviving the emergency by default.',
  'Los datos recogidos para atender a alguien durante una emergencia no tienen por qué sobrevivirla por defecto.',
  'Dados coletados para atender alguém durante uma emergência não têm por que sobreviver a ela por padrão.'],
'dp.unsolvedTitle': ['What this design does not solve', 'Lo que este diseño no resuelve', 'O que este projeto não resolve'],
'dp.unsolvedBody': ['These are the risks that remain, and pretending otherwise would be the dishonest part.',
  'Estos son los riesgos que quedan, y fingir lo contrario sería la parte deshonesta.',
  'Estes são os riscos que restam, e fingir o contrário seria a parte desonesta.'],
'dp.u1t': ['Somebody official will ask for the list.', 'Alguien de una autoridad pedirá la lista.', 'Alguém oficial vai pedir a lista.'],
'dp.u1': ['Minimal fields reduce the harm but do not remove the request. A coordinator standing in front of an official is the actual control, and software cannot be that for them.',
  'Los campos mínimos reducen el daño pero no eliminan la petición. Un coordinador frente a una autoridad es el control real, y el software no puede serlo por él.',
  'Campos mínimos reduzem o dano mas não eliminam o pedido. Um coordenador diante de uma autoridade é o controle real, e o software não pode ser isso por ele.'],
'dp.u2t': ['Closing a centre is a data event.', 'Cerrar un centro es un evento de datos.', 'Fechar um centro é um evento de dados.'],
'dp.u2': ['Nobody plans what happens to the records when an improvised centre stops operating, and that is when they are most likely to end up somewhere nobody intended.',
  'Nadie planea qué pasa con los registros cuando un centro improvisado deja de operar, y es justo cuando más probablemente terminan donde nadie quería.',
  'Ninguém planeja o que acontece com os registros quando um centro improvisado para de operar, e é justo aí que mais provavelmente vão parar onde ninguém queria.'],
'dp.u3t': ['Paper has its own exposure.', 'El papel tiene su propia exposición.', 'O papel tem sua própria exposição.'],
'dp.u3': ['A handwritten list on a clipboard is not safer than a database — it is simply unaudited. The fallback needs a policy too.',
  'Una lista a mano en una tabla no es más segura que una base de datos — solo es no auditada. La alternativa también necesita política.',
  'Uma lista à mão numa prancheta não é mais segura que um banco de dados — é apenas não auditada. A alternativa também precisa de política.'],
'dp.askTitle': ['If you know this area', 'Si conoce este terreno', 'Se você conhece esta área'],
'dp.askBody': [
  'This is the part of the design where being wrong causes real harm to people who cannot complain. If something here is legally or practically mistaken for your jurisdiction, that correction is more valuable to us than any feature request.',
  'Esta es la parte del diseño donde equivocarse hace daño real a personas que no pueden reclamar. Si algo aquí es legal o prácticamente erróneo en su jurisdicción, esa corrección nos vale más que cualquier petición de funcionalidad.',
  'Esta é a parte do projeto onde errar causa dano real a pessoas que não podem reclamar. Se algo aqui está legal ou praticamente errado na sua jurisdição, essa correção vale mais para nós que qualquer pedido de recurso.'],

/* ---- Open questions ---------------------------------------------------- */
'oq.title': ['Open questions', 'Preguntas abiertas', 'Perguntas em aberto'],
'oq.lede': [
  'These are the decisions that cannot be made from a desk. Each one has a plausible answer built into the prototype and no evidence behind it. If you have run a relief centre, this is the page where your disagreement is worth most.',
  'Estas son las decisiones que no se pueden tomar desde un escritorio. Cada una tiene una respuesta plausible incorporada al prototipo y ninguna evidencia detrás. Si ha dirigido un centro de ayuda, esta es la página donde su desacuerdo vale más.',
  'Estas são as decisões que não dá para tomar de uma mesa. Cada uma tem uma resposta plausível incorporada ao protótipo e nenhuma evidência por trás. Se você já dirigiu um centro de ajuda, esta é a página onde sua discordância vale mais.'],
'oq.weNeed': ['What would settle it:', 'Qué lo resolvería:', 'O que resolveria:'],
'oq.q1t': ['Will donors actually pre-register?', '¿Los donantes de verdad se pre-registrarán?', 'Os doadores realmente vão se pré-cadastrar?'],
'oq.q1': ['The entire design rests on a stranger doing sixty seconds of unpaid admin before an act of generosity. That is a real ask, and it may simply fail. If only 5% pre-register, the intake screen is just a slower version of what centres already do.',
  'Todo el diseño descansa en que un desconocido haga sesenta segundos de trámite no pagado antes de un acto de generosidad. Es una petición real, y puede simplemente fracasar. Si solo el 5% se pre-registra, la pantalla de recepción es una versión más lenta de lo que ya hacen los centros.',
  'Todo o projeto depende de um desconhecido fazer sessenta segundos de burocracia não paga antes de um ato de generosidade. É um pedido real, e pode simplesmente falhar. Se só 5% se pré-cadastrarem, a tela de recepção é só uma versão mais lenta do que os centros já fazem.'],
'oq.q1w': ['One ordinary donation drive, with and without the QR poster, counting the ratio.',
  'Una campaña de donaciones normal, con y sin el afiche QR, contando la proporción.',
  'Uma campanha de doações comum, com e sem o cartaz QR, contando a proporção.'],
'oq.q2t': ['Is the allocation ordering defensible in a real queue?', '¿El orden de asignación se sostiene en una fila real?', 'A ordem de alocação se sustenta numa fila real?'],
'oq.q2': ['The scoring here — children, elderly, medical, waiting time, household size — is invented. It looks reasonable on a screen. Whether it survives contact with a hundred people who all have a good reason to be first is a different question entirely.',
  'La puntuación aquí — menores, mayores, médico, tiempo de espera, tamaño del hogar — es inventada. Se ve razonable en pantalla. Si sobrevive el contacto con cien personas que todas tienen buena razón para ir primero es otra cosa completamente distinta.',
  'A pontuação aqui — crianças, idosos, médico, tempo de espera, tamanho da família — é inventada. Parece razoável na tela. Se sobrevive ao contato com cem pessoas que todas têm bom motivo para ser as primeiras é outra questão completamente diferente.'],
'oq.q2w': ['A coordinator telling us which factor is missing, and which one they would never defend out loud.',
  'Un coordinador diciéndonos qué factor falta, y cuál nunca defendería en voz alta.',
  'Um coordenador nos dizendo qual fator falta, e qual nunca defenderia em voz alta.'],
'oq.q3t': ['Does a three-minute course produce a competent volunteer?', '¿Un curso de tres minutos forma a un voluntario competente?', 'Um curso de três minutos forma um voluntário competente?'],
'oq.q3': ['We assume it beats a manual nobody reads. It might instead produce false confidence, which at an intake table is worse than admitted ignorance.',
  'Asumimos que le gana a un manual que nadie lee. En cambio podría producir falsa confianza, que en una mesa de recepción es peor que la ignorancia admitida.',
  'Assumimos que ganha de um manual que ninguém lê. Em vez disso pode produzir falsa confiança, que numa mesa de recepção é pior que a ignorância admitida.'],
'oq.q3w': ['Someone who trains volunteers telling us what three minutes can and cannot carry.',
  'Alguien que forma voluntarios diciéndonos qué puede y qué no puede cargar en tres minutos.',

'oq.q4t': ['What breaks when two centres edit the same stock offline?', '¿Qué se rompe si dos centros editan el mismo inventario sin conexión?', 'O que quebra se dois centros editam o mesmo estoque offline?'],
'oq.q4': ['This prototype queues writes and replays them. That is fine for one centre. Genuine multi-site offline editing with conflicting writes is a hard distributed-systems problem, and we have not solved it.',
  'Este prototipo encola escrituras y las reproduce. Sirve para un centro. La edición sin conexión multi-sitio con escrituras en conflicto es un problema difícil de sistemas distribuidos, y no lo hemos resuelto.',
  'Este protótipo enfileira escritas e as reproduz. Serve para um centro. A edição offline multi-site com escritas conflitantes é um problema difícil de sistemas distribuídos, e não resolvemos.'],
'oq.q4w': ['Knowing whether it matters. If centres rarely share stock in practice, this is a problem we can decline to have.',
  'Saber si importa. Si en la práctica los centros rara vez comparten inventario, es un problema que podemos declinar tener.',

'oq.q5t': ['Who is liable when the software is wrong?', '¿Quién responde si el software se equivoca?', 'Quem responde se o software erra?'],
'oq.q5': ['A voucher issued against stock that turns out to be miscounted sends a family away empty. In a volunteer-run centre with no legal entity behind it, nobody has thought about where that lands.',
  'Un vale emitido contra existencias mal contadas manda a una familia con las manos vacías. En un centro de voluntarios sin figura jurídica detrás, nadie ha pensado dónde cae eso.',
  'Um vale emitido contra estoque mal contado manda uma família embora de mãos vazias. Num centro de voluntários sem figura jurídica por trás, ninguém pensou onde isso cai.'],
'oq.q5w': ['Anyone who has dealt with the legal structure of an improvised shelter telling us how this normally works.',
  'Alguien que haya lidiado con la estructura legal de un albergue improvisado diciéndonos cómo funciona normalmente.',
  'Alguém que já lidou com a estrutura jurídica de um abrigo improvisado nos dizendo como isso normalmente funciona.'],
'oq.q6t': ['Should money and goods really share one flow?', '¿Deben dinero y bienes compartir un mismo flujo?', 'Dinheiro e bens devem mesmo compartilhar um fluxo?'],
'oq.q6': ['We put them together because a donor thinks of it as one act of giving. But money brings financial controls, fiscal sponsorship and fraud exposure that goods do not, and merging them may make the whole thing harder to adopt.',
  'Los juntamos porque el donante lo piensa como un solo acto de dar. Pero el dinero trae controles financieros, patrocinio fiscal y exposición al fraude que los bienes no tienen, y unirlos puede hacer todo más difícil de adoptar.',
  'Juntamos porque o doador pensa nisso como um único ato de doar. Mas dinheiro traz controles financeiros, patrocínio fiscal e exposição a fraude que bens não têm, e juntá-los pode tornar tudo mais difícil de adotar.'],
'oq.q6w': ['Whether a small centre would actually touch a tool that handles money at all.',
  'Si un centro pequeño de verdad tocaría una herramienta que maneja dinero.',
  'Se um centro pequeno realmente tocaria uma ferramenta que lida com dinheiro.'],
'oq.q7t': ['Is a QR the right artefact?', '¿Es el QR el artefacto adecuado?', 'O QR é o artefato certo?'],
'oq.q7': ['A code on a phone assumes a charged phone, a working camera at the door, and a donor comfortable with it. Handwriting the code works, but then the tag stops being machine-readable and the speed advantage disappears.',
  'Un código en el móvil supone un móvil cargado, una cámara que funcione en la puerta, y un donante cómodo con eso. Escribirlo a mano funciona, pero entonces la etiqueta deja de ser legible por máquina y la ventaja de velocidad desaparece.',
  'Um código no celular pressupõe um celular carregado, uma câmera funcionando na porta, e um doador confortável com isso. Escrever à mão funciona, mas então a etiqueta deixa de ser legível por máquina e a vantagem de velocidade some.'],

/* ============================================================================
 * SCENARIO DATA — the single source of truth.
 *
 * Every screen in CAPEM reads from here. Nothing is typed into markup. If baby
 * formula is short at one site, the donor's progress bar, the coordinator's
 * coverage figure, the inventory line and the alert all move together, because
 * they are all reading this one number.
 *
 * That is not a demo convenience. It is the architecture claim being made
 * literally: one reference spine, many views. A mockup that hard-codes numbers
 * per screen cannot make that claim honestly.
 *
 * BOTH SCENARIOS ARE FICTIONAL. They are set in real regions, and informed by
 * documented events (see docs/research.md), but no centre, person, quantity or
 * event here is real. See docs/research.md for what is evidence and what is
 * illustration.
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * Shared item catalogue. Aliases are what an intake volunteer actually types
 * under pressure — this list is why "cobijas", "mantas" and "blankets" cannot
 * become three separate stock lines.
 * -------------------------------------------------------------------------*/

  { code: 'WAT-600', cat: 'water',   unit: ['bottle', 'botella', 'garrafa'],
    name: ['Drinking water 600 ml', 'Agua potable 600 ml', 'Água potável 600 ml'],

  { code: 'HYG-STD', cat: 'hygiene', unit: ['kit', 'kit', 'kit'],

/* ---------------------------------------------------------------------------
 * Entitlement rules — the policy the matching engine applies.
 * Deliberately small, legible, and editable by a coordinator rather than
 * buried in code. Every allocation the engine makes cites the rule that
 * produced it, so a family can be told why they received what they received.
 * -------------------------------------------------------------------------*/
const ENTITLEMENTS = [
  { item: 'BLK-STD', per: 'person',    qty: 1, cap: 8,
    rule: ['One blanket per person', 'Una cobija por persona', 'Um cobertor por pessoa'] },
  { item: 'HYG-STD', per: 'household', qty: 1, cap: 1,

  { item: 'WAT-600', per: 'person',    qty: 6, cap: 48,
    rule: ['Six bottles per person per distribution', 'Seis botellas por persona por entrega', 'Seis garrafas por pessoa por entrega'] },
  { item: 'RCE-1K',  per: 'household', qty: 2, cap: 4,

/* ---------------------------------------------------------------------------
 * Population expansion.
 *
 * The hand-written families above are narrative anchors — they appear in the
 * walkthroughs by name. But a centre sheltering 312 people does not have six
 * households, and a matching engine that never runs out of stock demonstrates
 * nothing. Rationing is the interesting case, and the one practitioners will
 * want to interrogate.
 *
 * So the rest of the caseload is generated from the site's actual occupancy
 * with a fixed seed: deterministic, so every reviewer sees the same figures and
 * can refer to a household by reference, and consistent with the shelter counts
 * shown everywhere else.
 * -------------------------------------------------------------------------*/
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function expandFamilies(scenario) {
  const rand = mulberry32(scenario.id === 'tolima' ? 20260808 : 20260312);
  const generated = [];

  scenario.sites.forEach(site => {
    if (!site.shelter) return;
    const anchors = scenario.families.filter(f => f.site === site.id);
    const anchorPeople = anchors.reduce((a, f) => a + f.size, 0);
    let remaining = site.shelter.occupied - anchorPeople;
    if (remaining <= 0) return;

    const prefix = site.id.slice(0, 2).toUpperCase();
    let n = 1;
    while (remaining > 0) {
      // Household sizes weighted towards 2-5, which is what shelter censuses
      // in both documented events actually look like.
      const roll = rand();
      let size = roll < 0.14 ? 1 : roll < 0.36 ? 2 : roll < 0.60 ? 3 :
                 roll < 0.80 ? 4 : roll < 0.92 ? 5 : roll < 0.97 ? 6 : 7;
      size = Math.min(size, remaining);
      remaining -= size;

      const under5 = size >= 3 && rand() < 0.34 ? (rand() < 0.75 ? 1 : 2) : 0;
      const over65 = rand() < 0.19 ? 1 : 0;

      generated.push({
        ref: prefix + '-' + String(4000 + n * 7).padStart(4, '0'),
        site: site.id,
        size: size,
        under5: Math.min(under5, size),
        over65: Math.min(over65, size - under5 >= 0 ? over65 : 0),
        medical: rand() < 0.11,
        sheltered: true,
        daysWaiting: Math.floor(rand() * 5),
        needs: [],
        received: {},
        generated: true
      });
      n++;
    }
  });

  scenario.families = scenario.families.concat(generated);
  return scenario;
}

Object.values(SCENARIOS).forEach(expandFamilies);
